[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "antigravity-mobile-daemon"
version = "1.0.0"
description = "Edge LAN Gateway Daemon for Google Antigravity Mobile Companion"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Vladimir Fedorko", email = "vladimirfedorko225@gmail.com" }
]
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "websockets>=12.0",
    "pydantic>=2.0.0",
    "zeroconf>=0.130.0",
    "qrcode[pil]>=7.4.2",
    "aiofiles>=23.2.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0.0",
    "httpx>=0.27.0",
]

[project.scripts]
antigravity-mobile-daemon = "daemon.main:main"

[tool.pytest.ini_options]
pythonpath = ["."]
